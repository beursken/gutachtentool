# Übersetzt alle Fassungen des Gutachtentools und stellt die Ergebnisse als Artefakte bereit.
# Auslöser: jeder Push, jeder Pull Request, manuell (Actions › Build › Run workflow).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  kern:
    name: Kern (Gutachten2025.Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Gutachten2025.Core/Gutachten2025.Core.csproj -c Release

  windows:
    name: Windows (WinUI 3, Inno Setup)
    runs-on: windows-latest
    needs: kern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y
      - name: Installationsprogramm erstellen
        shell: pwsh
        run: ./Installer/Erstellen.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Gutachtentool-Windows
          path: Installer/Ausgabe/*.exe
          if-no-files-found: error
